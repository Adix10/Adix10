<svg width="1400" height="420" viewBox="0 0 1400 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="50%" stop-color="#0b1119"/>
      <stop offset="100%" stop-color="#04070c"/>
    </linearGradient>

    <linearGradient id="centerFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080d15" stop-opacity="0"/>
      <stop offset="18%" stop-color="#080d15" stop-opacity=".88"/>
      <stop offset="50%" stop-color="#080d15" stop-opacity=".97"/>
      <stop offset="82%" stop-color="#080d15" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#080d15" stop-opacity="0"/>
    </linearGradient>

    <!-- ================= GRID ================= -->

    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">

      <path d="M35 0H0V35"
            fill="none"
            stroke="#8db4c7"
            stroke-opacity=".07"
            stroke-width="1"/>

    </pattern>

    <!-- ================= GLITCH FILTER ================= -->

    <filter id="glitch">

      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.025 0.35"
        numOctaves="1"
        seed="7"
        result="noise">

        <animate
          attributeName="seed"
          values="7;19;4;27;7"
          dur="1.25s"
          repeatCount="1"/>

      </feTurbulence>

      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="0"
        xChannelSelector="R"
        yChannelSelector="G">

        <animate
          attributeName="scale"
          values="0;20;4;27;0"
          dur="1.25s"
          repeatCount="1"/>

      </feDisplacementMap>

    </filter>

    <!-- ================= CODE CLIP ================= -->

    <clipPath id="codeClip">
      <rect x="0" y="0" width="1400" height="420"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1400" height="420" fill="url(#bg)"/>

  <rect width="1400" height="420" fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- FALLING DIGITAL CODE -->
  <!-- ================================================= -->

  <g clip-path="url(#codeClip)"
     font-family="monospace"
     font-size="13"
     fill="#7bdcf5"
     opacity=".55">

    <!-- 01 -->
    <text x="35" y="-80">
      0101
      <animate attributeName="y"
               from="-100" to="500"
               dur="7s"
               repeatCount="indefinite"/>
    </text>

    <text x="35" y="-130" opacity=".35">
      1010
      <animate attributeName="y"
               from="-150" to="450"
               dur="7s"
               begin="1s"
               repeatCount="indefinite"/>
    </text>


    <!-- 02 -->
    <text x="105" y="-40">
      7F A2
      <animate attributeName="y"
               from="-80" to="480"
               dur="5.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="105" y="-170" opacity=".35">
      01 10
      <animate attributeName="y"
               from="-200" to="450"
               dur="5.5s"
               begin="2s"
               repeatCount="indefinite"/>
    </text>


    <!-- 03 -->
    <text x="180" y="-100">
      C++
      <animate attributeName="y"
               from="-120" to="470"
               dur="8s"
               repeatCount="indefinite"/>
    </text>

    <text x="180" y="-210" opacity=".35">
      0x4F
      <animate attributeName="y"
               from="-230" to="450"
               dur="8s"
               begin="3s"
               repeatCount="indefinite"/>
    </text>


    <!-- 04 -->
    <text x="270" y="-70">
      PY
      <animate attributeName="y"
               from="-90" to="500"
               dur="6s"
               repeatCount="indefinite"/>
    </text>

    <text x="270" y="-190" opacity=".35">
      11001
      <animate attributeName="y"
               from="-210" to="470"
               dur="6s"
               begin="2s"
               repeatCount="indefinite"/>
    </text>


    <!-- 05 -->
    <text x="350" y="-120">
      AI
      <animate attributeName="y"
               from="-140" to="480"
               dur="7.5s"
               repeatCount="indefinite"/>
    </text>


    <!-- 06 -->
    <text x="430" y="-50">
      3C 91
      <animate attributeName="y"
               from="-70" to="470"
               dur="5s"
               repeatCount="indefinite"/>
    </text>


    <!-- 07 -->
    <text x="510" y="-180">
      101011
      <animate attributeName="y"
               from="-200" to="460"
               dur="8.5s"
               repeatCount="indefinite"/>
    </text>


    <!-- 08 -->
    <text x="590" y="-90">
      ML
      <animate attributeName="y"
               from="-110" to="480"
               dur="6.5s"
               repeatCount="indefinite"/>
    </text>


    <!-- 09 -->
    <text x="680" y="-150">
      0110
      <animate attributeName="y"
               from="-170" to="470"
               dur="7s"
               repeatCount="indefinite"/>
    </text>


    <!-- 10 -->
    <text x="770" y="-60">
      8A 3F
      <animate attributeName="y"
               from="-80" to="480"
               dur="5.7s"
               repeatCount="indefinite"/>
    </text>


    <!-- 11 -->
    <text x="850" y="-130">
      JS
      <animate attributeName="y"
               from="-150" to="470"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <!-- 12 -->
    <text x="930" y="-80">
      0011
      <animate attributeName="y"
               from="-100" to="480"
               dur="6.2s"
               repeatCount="indefinite"/>
    </text>


    <!-- 13 -->
    <text x="1010" y="-180">
      SEC
      <animate attributeName="y"
               from="-200" to="470"
               dur="7.7s"
               repeatCount="indefinite"/>
    </text>


    <!-- 14 -->
    <text x="1090" y="-50">
      4D 21
      <animate attributeName="y"
               from="-70" to="490"
               dur="5.4s"
               repeatCount="indefinite"/>
    </text>


    <!-- 15 -->
    <text x="1170" y="-120">
      11010
      <animate attributeName="y"
               from="-140" to="470"
               dur="6.8s"
               repeatCount="indefinite"/>
    </text>


    <!-- 16 -->
    <text x="1250" y="-70">
      0xAD
      <animate attributeName="y"
               from="-90" to="480"
               dur="7.2s"
               repeatCount="indefinite"/>
    </text>


    <!-- 17 -->
    <text x="1340" y="-160">
      101
      <animate attributeName="y"
               from="-180" to="470"
               dur="5.8s"
               repeatCount="indefinite"/>
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DIGITAL BACKGROUND DATA -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="10"
     fill="#b7efff"
     opacity=".22">

    <text x="60" y="30">110100101001</text>
    <text x="220" y="95">011010010111</text>
    <text x="380" y="55">101001011010</text>
    <text x="530" y="120">010101101001</text>
    <text x="760" y="40">110010100110</text>
    <text x="900" y="105">001101011010</text>
    <text x="1050" y="65">101010011001</text>
    <text x="1210" y="125">010011101010</text>

  </g>


  <!-- ================================================= -->
  <!-- SIDE NETWORK -->
  <!-- ================================================= -->

  <g stroke="#72d8f2"
     stroke-width="1"
     opacity=".28"
     fill="none">

    <path d="M20 310 L100 270 L170 330 L250 285"/>
    <path d="M1160 300 L1230 250 L1310 295 L1380 235"/>

    <path d="M70 190 L140 150 L210 205"/>
    <path d="M1190 170 L1260 130 L1350 185"/>

  </g>


  <g fill="#9beaff" opacity=".65">

    <circle cx="20" cy="310" r="2"/>
    <circle cx="100" cy="270" r="2"/>
    <circle cx="170" cy="330" r="2"/>
    <circle cx="250" cy="285" r="2"/>

    <circle cx="1160" cy="300" r="2"/>
    <circle cx="1230" cy="250" r="2"/>
    <circle cx="1310" cy="295" r="2"/>
    <circle cx="1380" cy="235" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- ANALYTICS GRAPH -->
  <!-- ================================================= -->

  <g transform="translate(55 300)"
     fill="none"
     stroke="#73d9f4"
     stroke-width="2"
     opacity=".6">

    <polyline points="
      0,55
      25,42
      48,48
      70,25
      95,34
      120,12
      145,20
      170,-5
      195,8
      220,-18
    "/>

    <circle cx="220" cy="-18" r="3" fill="#a6edff"/>

  </g>


  <!-- ================================================= -->
  <!-- DATA BARS -->
  <!-- ================================================= -->

  <g transform="translate(1150 290)"
     fill="#70d7f2"
     opacity=".45">

    <rect x="0" y="30" width="12" height="55">
      <animate attributeName="height"
               values="30;65;40;55;30"
               dur="3s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="22" y="10" width="12" height="75">
      <animate attributeName="height"
               values="75;40;70;25;75"
               dur="3.5s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="44" y="42" width="12" height="43">
      <animate attributeName="height"
               values="43;70;25;55;43"
               dur="2.8s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="66" y="20" width="12" height="65">
      <animate attributeName="height"
               values="65;30;80;45;65"
               dur="3.2s"
               repeatCount="indefinite"/>
    </rect>

  </g>


  <!-- ================================================= -->
  <!-- CENTER READABILITY ZONE -->
  <!-- ================================================= -->

  <rect x="250"
        y="105"
        width="900"
        height="220"
        rx="8"
        fill="url(#centerFade)"/>


  <!-- CENTER GUIDES -->

  <g stroke="#8fe9ff"
     stroke-width="1"
     opacity=".18">

    <line x1="330" y1="160" x2="1070" y2="160"/>
    <line x1="330" y1="270" x2="1070" y2="270"/>

  </g>


  <!-- ================================================= -->
  <!-- ONE-TIME GLITCH: RED CHANNEL -->
  <!-- ================================================= -->

  <text x="700"
        y="215"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="700"
        letter-spacing="7"
        fill="#ff4f64"
        opacity="0">

    ADITYA SHARMA

    <animate
      attributeName="opacity"
      values="0;0;.9;0;.75;0;0"
      keyTimes="0;.16;.28;.40;.50;.64;1"
      dur="1.45s"
      repeatCount="1"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;14 0;-9 0;7 0;0 0"
      dur="1.45s"
      repeatCount="1"/>

  </text>


  <!-- ================================================= -->
  <!-- ONE-TIME GLITCH: BLUE CHANNEL -->
  <!-- ================================================= -->

  <text x="700"
        y="215"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="700"
        letter-spacing="7"
        fill="#42e7ff"
        opacity="0">

    ADITYA SHARMA

    <animate
      attributeName="opacity"
      values="0;.75;0;.85;0;.5;0"
      keyTimes="0;.18;.33;.47;.57;.68;1"
      dur="1.45s"
      repeatCount="1"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-12 0;8 0;-5 0;0 0"
      dur="1.45s"
      repeatCount="1"/>

  </text>


  <!-- ================================================= -->
  <!-- MAIN IDENTITY -->
  <!-- ================================================= -->

  <text x="700"
        y="215"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="700"
        letter-spacing="7"
        fill="#edfaff"
        filter="url(#glitch)">

    ADITYA SHARMA

    <animate
      attributeName="opacity"
      values="0;0;1;.2;1;1"
      keyTimes="0;.22;.34;.44;.57;1"
      dur="1.5s"
      repeatCount="1"/>

  </text>


  <!-- ================================================= -->
  <!-- GLITCH SLICES -->
  <!-- ================================================= -->

  <g opacity="0">

    <rect x="450"
          y="190"
          width="500"
          height="7"
          fill="#8fe9ff"/>

    <rect x="520"
          y="226"
          width="360"
          height="5"
          fill="#ff4f64"/>

    <rect x="600"
          y="202"
          width="190"
          height="4"
          fill="#42e7ff"/>

    <animate
      attributeName="opacity"
      values="0;0;1;0;1;0"
      keyTimes="0;.23;.32;.42;.52;.66"
      dur="1.25s"
      repeatCount="1"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;28 0;-22 0;14 0;0 0"
      dur="1.25s"
      repeatCount="1"/>

  </g>


  <!-- ================================================= -->
  <!-- ACCENT LINE -->
  <!-- ================================================= -->

  <line x1="470"
        y1="235"
        x2="930"
        y2="235"
        stroke="#78def7"
        stroke-width="2"
        opacity=".8">

    <animate attributeName="x1"
             values="470;520;470"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="930;880;930"
             dur="4s"
             repeatCount="indefinite"/>

  </line>


  <!-- ================================================= -->
  <!-- SUBTITLE -->
  <!-- ================================================= -->

  <text x="700"
        y="260"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        letter-spacing="4"
        fill="#9fc2cf">

    AI  •  DATA SCIENCE  •  CYBERSECURITY

  </text>


  <!-- ================================================= -->
  <!-- SYSTEM INFORMATION -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="10"
     fill="#82dff7"
     opacity=".55">

    <text x="25" y="25">
      NET://ADX-01
    </text>

    <text x="1080" y="25">
      SECURE_CHANNEL: ACTIVE
    </text>

    <text x="25" y="395">
      PACKETS: 010101
    </text>

    <text x="1080" y="395">
      ENCRYPTION: AES-256
    </text>

  </g>


  <!-- ================================================= -->
  <!-- STATUS BAR -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="10"
     letter-spacing="1">

    <text x="510"
          y="300"
          fill="#7de4f8"
          opacity=".8">

      ● SYSTEM ONLINE

    </text>

    <text x="700"
          y="300"
          text-anchor="middle"
          fill="#94b8c5"
          opacity=".7">

      DATA FLOW: ACTIVE

    </text>

    <text x="890"
          y="300"
          fill="#94b8c5"
          opacity=".7">

      NODE: ADX-01

    </text>

  </g>


  <!-- ================================================= -->
  <!-- ONE-TIME BOOT SCAN -->
  <!-- ================================================= -->

  <rect x="-5"
        y="0"
        width="5"
        height="420"
        fill="#a5efff"
        opacity=".65">

    <animate
      attributeName="x"
      from="-5"
      to="1405"
      dur="1.35s"
      repeatCount="1"/>

    <animate
      attributeName="opacity"
      values=".8;.7;.35;0"
      dur="1.35s"
      repeatCount="1"/>

  </rect>


  <!-- ================================================= -->
  <!-- PERMANENT SUBTLE SCAN -->
  <!-- ================================================= -->

  <rect x="0"
        y="0"
        width="2"
        height="420"
        fill="#8fe9ff"
        opacity=".10">

    <animate
      attributeName="x"
      from="0"
      to="1400"
      dur="9s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect x="8"
        y="8"
        width="1384"
        height="404"
        rx="10"
        fill="none"
        stroke="#82dff7"
        stroke-opacity=".22"
        stroke-width="1"/>

</svg>
