
<svg width="1000" height="300" viewBox="0 0 1000 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050A10"/>
      <stop offset="55%" stop-color="#08111C"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="25" height="25"
             patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25"
            fill="none"
            stroke="#1E293B"
            stroke-width="0.6"
            opacity="0.35"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1000" height="300" rx="18"
        fill="url(#bg)"/>

  <rect width="1000" height="300" rx="18"
        fill="url(#grid)"/>


  <!-- BORDER -->

  <rect x="1" y="1" width="998" height="298" rx="18"
        fill="none"
        stroke="#1E3A52"
        stroke-width="1"/>


  <!-- HEADER -->

  <text x="35" y="38"
