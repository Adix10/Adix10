name: Update Contribution Breaker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-breaker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Breaker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          username = "Adix10"

          end_date = datetime.now(timezone.utc)
          start_date = end_date - timedelta(days=365)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          variables = {
              "login": username,
              "from": start_date.isoformat(),
              "to": end_date.isoformat()
          }

          payload = json.dumps({
              "query": query,
              "variables": variables
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "Adix10-Contribution-Breaker"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read().decode("utf-8"))

          if "errors" in data:
              raise RuntimeError(data["errors"])

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              days.extend(week["contributionDays"])

          days = days[-364:]

          max_count = max(
              (day["contributionCount"] for day in days),
              default=0
          )

          def level(count):
              if count == 0:
                  return 0
              if count <= 2:
                  return 1
              if count <= 5:
                  return 2
              if count <= 9:
                  return 3
              return 4

          svg = []

          svg.append(f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="1100"
          height="500"
          viewBox="0 0 1100 500">

          <defs>

            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#020617"/>
              <stop offset="50%" stop-color="#07111F"/>
              <stop offset="100%" stop-color="#020617"/>
            </linearGradient>

            <linearGradient id="paddle" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#0891B2"/>
              <stop offset="50%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#67E8F9"/>
            </linearGradient>

            <filter id="glow">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <filter id="ballGlow">
              <feGaussianBlur stdDeviation="7"/>
            </filter>

            <pattern id="grid"
                     width="25"
                     height="25"
                     patternUnits="userSpaceOnUse">
              <path d="M 25 0 L 0 0 0 25"
                    fill="none"
                    stroke="#0F2535"
                    stroke-width="0.7"/>
            </pattern>

            <style>

              .brick1 {{
                animation: brickPulse1 3s ease-in-out infinite;
              }}

              .brick2 {{
                animation: brickPulse2 4s ease-in-out infinite;
              }}

              .brick3 {{
                animation: brickPulse3 5s ease-in-out infinite;
              }}

              .gameBall {{
                animation:
                  ballMove 3.6s linear infinite,
                  ballGlow 1.2s ease-in-out infinite;
                transform-box: fill-box;
                transform-origin: center;
              }}

              .paddle {{
                animation: paddleMove 3.6s ease-in-out infinite;
              }}

              .impact1 {{
                animation: impact 3.6s linear infinite;
              }}

              .impact2 {{
                animation: impact2 3.6s linear infinite;
              }}

              .scan {{
                animation: scanMove 4s linear infinite;
              }}

              @keyframes brickPulse1 {{
                0%, 100% {{ opacity: .72; }}
                50% {{ opacity: 1; }}
              }}

              @keyframes brickPulse2 {{
                0%, 100% {{ opacity: .8; }}
                50% {{ opacity: 1; }}
              }}

              @keyframes brickPulse3 {{
                0%, 100% {{ opacity: .86; }}
                50% {{ opacity: 1; }}
              }}

              /*
                Breakout trajectory:
                start near paddle
                travel upward
                strike upper blocks
                return downward
                hit paddle
                repeat
              */

              @keyframes ballMove {{

                0% {{
                  transform: translate(0px, 0px);
                }}

                18% {{
                  transform: translate(-105px, -115px);
                }}

                35% {{
                  transform: translate(35px, -205px);
                }}

                50% {{
                  transform: translate(170px, -115px);
                }}

                67% {{
                  transform: translate(65px, -15px);
                }}

                82% {{
                  transform: translate(-80px, -95px);
                }}

                100% {{
                  transform: translate(0px, 0px);
                }}

              }}

              @keyframes paddleMove {{

                0% {{
                  transform: translateX(0px);
                }}

                18% {{
                  transform: translateX(-90px);
                }}

                35% {{
                  transform: translateX(70px);
                }}

                50% {{
                  transform: translateX(120px);
                }}

                67% {{
                  transform: translateX(45px);
                }}

                82% {{
                  transform: translateX(-75px);
                }}

                100% {{
                  transform: translateX(0px);
                }}

              }}

              @keyframes ballGlow {{

                0%, 100% {{
                  filter: drop-shadow(0 0 4px #38BDF8);
                }}

                50% {{
                  filter: drop-shadow(0 0 12px #67E8F9);
                }}

              }}

              @keyframes impact {{

                0%, 30%, 100% {{
                  opacity: 0;
                  transform: scale(.2);
                }}

                35% {{
                  opacity: 1;
                  transform: scale(1.2);
                }}

                40% {{
                  opacity: 0;
                  transform: scale(1.8);
                }}

              }}

              @keyframes impact2 {{

                0%, 48%, 100% {{
                  opacity: 0;
                  transform: scale(.2);
                }}

                53% {{
                  opacity: 1;
                  transform: scale(1.3);
                }}

                58% {{
                  opacity: 0;
                  transform: scale(1.8);
                }}

              }}

              @keyframes scanMove {{

                0% {{
                  transform: translateY(0px);
                  opacity: 0;
                }}

                15% {{
                  opacity: .6;
                }}

                85% {{
                  opacity: .6;
                }}

                100% {{
                  transform: translateY(280px);
                  opacity: 0;
                }}

              }}

            </style>

          </defs>

          <!-- BACKGROUND -->

          <rect width="1100"
                height="500"
                fill="url(#bg)"/>

          <rect x="25"
                y="25"
                width="1050"
                height="450"
                rx="16"
                fill="none"
                stroke="#164E63"/>

          <!-- TITLE -->

          <text x="55"
                y="70"
                fill="#67E8F9"
                font-size="24"
                font-family="monospace"
                font-weight="bold">
            CONTRIBUTION BREAKER
          </text>

          <text x="55"
                y="94"
                fill="#64748B"
                font-size="11"
                font-family="monospace"
                letter-spacing="1">
            BREAK THE BLOCKS // BUILD THE STREAK
          </text>

          <!-- PLAYER PANEL -->

          <rect x="45"
                y="125"
                width="190"
                height="295"
                rx="10"
                fill="#040A12"
                stroke="#1E3A4D"/>

          <text x="62"
                y="160"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            PLAYER
          </text>

          <text x="62"
                y="190"
                fill="#67E8F9"
                font-size="21"
                font-family="monospace">
            ADIX10
          </text>

          <text x="62"
                y="225"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            SCORE
          </text>

          <text x="62"
                y="255"
                fill="#67E8F9"
                font-size="25"
                font-family="monospace">
            {total}
          </text>

          <text x="62"
                y="290"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            MAX DAY
          </text>

          <text x="62"
                y="320"
                fill="#A78BFA"
                font-size="22"
                font-family="monospace">
            {max_count}
          </text>

          <text x="62"
                y="355"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            SOURCE
          </text>

          <text x="62"
                y="378"
                fill="#CBD5E1"
                font-size="13"
                font-family="monospace">
            github.com
          </text>

          <text x="62"
                y="398"
                fill="#CBD5E1"
                font-size="13"
                font-family="monospace">
            /Adix10
          </text>

          <!-- GAME -->

          <rect x="270"
                y="112"
                width="788"
                height="305"
                rx="10"
                fill="#030811"
                stroke="#1E3A4D"/>

          <rect x="270"
                y="112"
                width="788"
                height="305"
                rx="10"
                fill="url(#grid)"
                opacity=".5"/>

          <!-- GAME BORDER -->

          <line x1="285"
                y1="150"
                x2="1043"
                y2="150"
                stroke="#164E63"/>

          <!-- CONTRIBUTION BLOCKS -->

          ''')

          start_x = 300
          start_y = 165

          brick_w = 14
          brick_h = 10
          gap_x = 5
          gap_y = 8

          for i, day in enumerate(days):

              col = i // 7
              row = i % 7

              x = start_x + col * (brick_w + gap_x)
              y = start_y + row * (brick_h + gap_y)

              lvl = level(day["contributionCount"])

              if lvl == 0:
                  fill = "#0B1724"
                  stroke = "#132536"

              elif lvl == 1:
                  fill = "#164E63"
                  stroke = "#155E75"

              elif lvl == 2:
                  fill = "#075985"
                  stroke = "#0284C7"

              elif lvl == 3:
                  fill = "#0284C7"
                  stroke = "#38BDF8"

              else:
                  fill = "#38BDF8"
                  stroke = "#67E8F9"

              cls = "brick1" if row % 3 == 0 else (
                  "brick2" if row % 3 == 1 else "brick3"
              )

              svg.append(
                  f'''<rect
                  class="{cls}"
                  x="{x}"
                  y="{y}"
                  width="{brick_w}"
                  height="{brick_h}"
                  rx="2"
                  fill="{fill}"
                  stroke="{stroke}"
                  stroke-width="0.7"/>'''
              )

          svg.append('''

          <!-- FAKE IMPACT FLASHES -->

          <circle class="impact1"
                  cx="655"
                  cy="170"
                  r="15"
                  fill="none"
                  stroke="#67E8F9"
                  stroke-width="2"/>

          <circle class="impact2"
                  cx="825"
                  cy="215"
                  r="15"
                  fill="none"
                  stroke="#A78BFA"
                  stroke-width="2"/>

          <!-- BALL TRAIL -->

          <circle cx="690"
                  cy="350"
                  r="10"
                  fill="#38BDF8"
                  opacity=".12"
                  filter="url(#ballGlow)"
                  class="gameBall"/>

          <circle cx="690"
                  cy="350"
                  r="6"
                  fill="#67E8F9"
                  filter="url(#glow)"
                  class="gameBall"/>

          <circle cx="690"
                  cy="350"
                  r="2.5"
                  fill="#FFFFFF"
                  class="gameBall"/>

          <!-- PADDLE -->

          <g class="paddle">

            <rect x="630"
                  y="365"
                  width="150"
                  height="10"
                  rx="5"
                  fill="url(#paddle)"
                  filter="url(#glow)"/>

            <rect x="650"
                  y="363"
                  width="110"
                  height="14"
                  rx="7"
                  fill="none"
                  stroke="#67E8F9"
                  stroke-opacity=".45"/>

          </g>

          <!-- SCAN -->

          <rect class="scan"
                x="285"
                y="150"
                width="758"
                height="1"
                fill="#38BDF8"/>

          <!-- HUD -->

          <line x1="295"
                y1="395"
                x2="1030"
                y2="395"
                stroke="#1E3A4D"/>

          <text x="295"
                y="410"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            BLOCKS
          </text>

          <text x="350"
                y="410"
                fill="#CBD5E1"
                font-size="11"
                font-family="monospace">
            364 DAYS
          </text>

          <text x="520"
                y="410"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            STATUS
          </text>

          <text x="575"
                y="410"
                fill="#22C55E"
                font-size="11"
                font-family="monospace">
            ACTIVE
          </text>

          <text x="700"
                y="410"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            UPDATE
          </text>

          <text x="760"
                y="410"
                fill="#CBD5E1"
                font-size="11"
                font-family="monospace">
            24H
          </text>

          <text x="895"
                y="410"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            USER
          </text>

          <text x="945"
                y="410"
                fill="#67E8F9"
                font-size="11"
                font-family="monospace">
            ADIX10
          </text>

          <!-- LEGEND -->

          <text x="300"
                y="450"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            ACTIVITY LEVEL
          </text>

          <rect x="425" y="441" width="12" height="12" rx="2" fill="#0B1724"/>
          <rect x="445" y="441" width="12" height="12" rx="2" fill="#164E63"/>
          <rect x="465" y="441" width="12" height="12" rx="2" fill="#075985"/>
          <rect x="485" y="441" width="12" height="12" rx="2" fill="#0284C7"/>
          <rect x="505" y="441" width="12" height="12" rx="2" fill="#38BDF8"/>

          <text x="535"
                y="451"
                fill="#64748B"
                font-size="11"
                font-family="monospace">
            LOW
          </text>

          <text x="1010"
                y="451"
                fill="#64748B"
                font-size="11"
                font-family="monospace"
                text-anchor="end">
            HIGH
          </text>

          </svg>
          ''')

          with open(
              "assets/activity-matrix.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("".join(svg))

          print("Contribution Breaker generated successfully.")
          print(f"Total contributions: {total}")
          print(f"Maximum daily contributions: {max_count}")
          PY

      - name: Commit updated Contribution Breaker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-matrix.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Upgrade contribution breaker animation"
            git push
          fi