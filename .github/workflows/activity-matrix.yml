
name: Update Activity Matrix

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta

          username = "Adix10"

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          today = datetime.utcnow()
          start = today - timedelta(days=365)

          payload = {
              "query": query,
              "variables": {
                  "login": username,
                  "from": start.isoformat() + "Z",
                  "to": today.isoformat() + "Z"
              }
          }

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + __import__("os").environ["GITHUB_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "Adix10-Activity-Matrix"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days = days[-371:]

          cells = []

          for index, day in enumerate(days):
              count = day["contributionCount"]

              if count == 0:
                  level = 0
              elif count <= 2:
                  level = 1
              elif count <= 5:
                  level = 2
              elif count <= 9:
                  level = 3
              else:
                  level = 4

              cells.append((index, day["date"], count, level))

          colors = [
              "#0F172A",
              "#164E63",
              "#075985",
              "#0284C7",
              "#38BDF8"
          ]

          width = 1000
          height = 300

          svg = f'''<svg width="{width}" height="{height}"
          viewBox="0 0 {width} {height}"
          xmlns="http://www.w3.org/2000/svg">

          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#050A10"/>
              <stop offset="55%" stop-color="#08111C"/>
              <stop offset="100%" stop-color="#0B1220"/>
            </linearGradient>

            <pattern id="grid" width="25" height="25"
                     patternUnits="userSpaceOnUse">
              <path d="M25 0 L0 0 0 25"
                    fill="none"
                    stroke="#1E293B"
                    stroke-width="0.6"
                    opacity="0.35"/>
            </pattern>

            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
          <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

          <rect x="1" y="1" width="998" height="298" rx="18"
                fill="none"
                stroke="#1E3A52"/>

          <text x="35" y="38"
                fill="#7DD3FC"
                font-family="monospace"
                font-size="13"
                letter-spacing="2">
            ACTIVITY MATRIX
          </text>

          <text x="965" y="38"
                fill="#64748B"
                font-family="monospace"
                font-size="11"
                text-anchor="end">
            GITHUB / LIVE CONTRIBUTION DATA
          </text>

          <circle cx="38" cy="62" r="4"
                  fill="#22C55E"
                  filter="url(#glow)">
            <animate attributeName="opacity"
                     values="1;0.3;1"
                     dur="2s"
                     repeatCount="indefinite"/>
          </circle>

          <text x="50" y="66"
                fill="#94A3B8"
                font-family="monospace"
                font-size="11">
            ADIX10 • CONTRIBUTION SIGNAL
          </text>

          <text x="165" y="92"
                fill="#64748B"
                font-family="monospace"
                font-size="9">
            LAST 12 MONTHS
          </text>

          <g transform="translate(165,105)">
          '''

          cell_size = 14
          gap = 5

          for index, date, count, level in cells:
              col = index // 7
              row = index % 7

              x = col * (cell_size + gap)
              y = row * (cell_size + gap)

              tooltip = f"{date} • {count} contributions"

              svg += f'''
              <rect x="{x}" y="{y}"
                    width="{cell_size}"
                    height="{cell_size}"
                    rx="3"
                    fill="{colors[level]}">
                <title>{tooltip}</title>
              </rect>
              '''

          svg += f'''
          </g>

          <text x="165" y="222"
                fill="#64748B"
                font-family="monospace"
                font-size="9">
            ACTIVITY
          </text>

          <rect x="220" y="212" width="13" height="13" rx="2"
                fill="#0F172A"/>
          <rect x="239" y="212" width="13" height="13" rx="2"
                fill="#164E63"/>
          <rect x="258" y="212" width="13" height="13" rx="2"
                fill="#075985"/>
          <rect x="277" y="212" width="13" height="13" rx="2"
                fill="#0284C7"/>
          <rect x="296" y="212" width="13" height="13" rx="2"
                fill="#38BDF8"/>

          <text x="315" y="222"
                fill="#64748B"
                font-family="monospace"
                font-size="9">
            LOW → HIGH
          </text>

          <text x="760" y="110"
                fill="#7DD3FC"
                font-family="monospace"
                font-size="10">
            CONTRIBUTIONS
          </text>

          <text x="760" y="145"
                fill="#E2E8F0"
                font-family="monospace"
                font-size="26">
            {calendar["totalContributions"]}
          </text>

          <text x="760" y="165"
                fill="#64748B"
                font-family="monospace"
                font-size="9">
            TOTAL / LAST YEAR
          </text>

          <text x="760" y="195"
                fill="#7DD3FC"
                font-family="monospace"
                font-size="10">
            SOURCE
          </text>

          <text x="760" y="215"
                fill="#94A3B8"
                font-family="monospace"
                font-size="10">
            github.com/Adix10
          </text>

          <text x="35" y="270"
                fill="#475569"
                font-family="monospace"
                font-size="9">
            DATA_STREAM :: AUTOMATED
          </text>

          <text x="965" y="270"
                fill="#475569"
                font-family="monospace"
                font-size="9"
                text-anchor="end">
            AUTO_UPDATE :: 24H
          </text>

          </svg>
          '''

          with open("assets/activity-matrix.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print("Activity matrix updated successfully.")
          print("Total contributions:", calendar["totalContributions"])
          PY

      - name: Commit updated matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-matrix.svg

          git diff --cached --quiet || git commit -m "Update activity matrix"

      - name: Push changes
        run: |
          git push